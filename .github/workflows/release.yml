name: Stable release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, and publish Windows release
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Check out exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-core.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.10.0'
          package-manager-cache: false

      - name: Validate stable tag and source metadata
        shell: pwsh
        run: |
          node scripts/release-contract.cjs --tag "$env:GITHUB_REF_NAME" --require-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main

      - name: Create unpublished release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-contract.cjs --tag "$env:GITHUB_REF_NAME" --notes-file ".build/release-notes.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag `
            --title "Meowtoko E7 Tool $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file ".build/release-notes.md"

      - name: Install exact dependencies
        shell: pwsh
        run: |
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --global pnpm@11.9.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop install --frozen-lockfile

      - name: Run complete source verification
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/validate-documentation.cjs

      - name: Build and audit installer
        run: pnpm --dir desktop make

      - name: Verify frozen resources and package lifecycle
        shell: pwsh
        run: |
          python scripts/verify_cuda_installer.py dist/cuda-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_setup_flows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_frozen_backend.py dist/backend/e7-core.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop smoke:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop smoke:single-instance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_update_recovery.py dist/backend/e7-core.exe

      - name: Stage audited release assets
        run: node scripts/stage-github-release.cjs --tag "${{ github.ref_name }}"

      - name: Upload audited assets to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseRoot = ".build/github-release/$env:GITHUB_REF_NAME"
          gh release upload "$env:GITHUB_REF_NAME" `
            "$releaseRoot/Meowtoko-E7-Tool-$($env:GITHUB_REF_NAME.TrimStart('v'))-Setup.exe" `
            "$releaseRoot/E7Hub-$($env:GITHUB_REF_NAME.TrimStart('v'))-full.nupkg" `
            "$releaseRoot/RELEASES" `
            "$releaseRoot/Meowtoko.E7.Tool-win32-x64-$($env:GITHUB_REF_NAME.TrimStart('v')).zip" `
            "$releaseRoot/SHA256SUMS.txt" `
            --clobber

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest

      - name: Capture failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build/release-diagnostics | Out-Null
          @(
            "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "tag=$env:GITHUB_REF_NAME"
            "commit=$env:GITHUB_SHA"
            "runner=$env:RUNNER_NAME"
            "node=$(node --version 2>&1)"
            "python=$(python --version 2>&1)"
          ) | Set-Content .build/release-diagnostics/summary.txt
          git status --short | Set-Content .build/release-diagnostics/git-status.txt

      - name: Attach diagnostics to failed draft
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" `
            .build/release-diagnostics/summary.txt `
            .build/release-diagnostics/git-status.txt `
            --clobber

      - name: Retain failed diagnostics in Actions
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-${{ github.ref_name }}
          path: .build/release-diagnostics
          if-no-files-found: error
          retention-days: 14
