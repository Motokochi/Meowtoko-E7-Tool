name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-core.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.10.0'
          package-manager-cache: false

      - name: Install pinned Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install pinned pnpm and desktop dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@11.9.0
          pnpm --dir desktop install --frozen-lockfile

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run desktop, cleanup, and repository contract tests
        run: pnpm --dir desktop test

      - name: Type-check desktop
        run: pnpm --dir desktop typecheck

      - name: Validate documentation links
        run: node scripts/validate-documentation.cjs

      - name: Validate source release metadata
        run: node scripts/release-contract.cjs
